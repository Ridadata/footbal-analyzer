<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Football Data Visualization{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <!-- Include Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <h1>Football Data Visualization</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/live-matches">Live Matches</a></li>
                <!-- Add more navigation links as needed -->
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Football Data Visualization Project</p>
    </footer>

    <script src="{{ url_for('static', path='/scripts.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
